<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0F14">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Rachide</title>

<style>
:root{
  --bg:#0A0F14; --surf:#131C24; --surf2:#1B2833; --line:#26343F;
  --bone:#E9EEF3; --mut:#7D8D9B; --dim:#4E5F6D;
  --amb:#E0A458; --glow:#6FB3C4; --alert:#D45D5D; --ok:#7FB069;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--bone)}
body{
  font:400 16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-variant-numeric:tabular-nums;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
  overscroll-behavior-y:contain;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}

/* ---------- micro-label: the clinical register of a radiology report ---------- */
.eyebrow{
  font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim);
}
.eyebrow.amb{color:var(--amb)}
.eyebrow.glow{color:var(--glow)}

h1{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:2px 0 0}
h2{font-size:15px;font-weight:650;letter-spacing:-.01em;margin:0}
.num{font-weight:700;letter-spacing:-.03em}
.mut{color:var(--mut)}
.sm{font-size:13px}
.xs{font-size:11.5px}

/* ---------- top bar ---------- */
header.top{
  position:sticky;top:0;z-index:40;background:rgba(10,15,20,.92);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
  padding:calc(8px + env(safe-area-inset-top)) 0 8px;
}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.clock{font-size:15px;font-weight:700;letter-spacing:-.02em;padding:5px 10px;border:1px solid var(--line);border-radius:10px}
.clock.warn{border-color:var(--amb);color:var(--amb)}

/* ---------- cards ---------- */
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0}
.card.flat{background:none;border-style:dashed}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
hr.hair{border:0;border-top:1px solid var(--line);margin:12px 0}

/* ---------- buttons ---------- */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  min-height:48px;padding:0 16px;border-radius:12px;border:1px solid var(--line);
  background:var(--surf2);font-weight:600;font-size:15px;width:100%;
}
.btn:active{transform:scale(.985)}
.btn.pri{background:var(--glow);color:#08151A;border-color:var(--glow)}
.btn.amb{background:var(--amb);color:#1A1206;border-color:var(--amb)}
.btn.ghost{background:none}
.btn.sm{min-height:38px;font-size:13.5px;padding:0 12px;width:auto}
.btn[disabled]{opacity:.4}

/* ---------- steppers ---------- */
.step{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surf2)}
.step button{width:46px;height:46px;font-size:22px;font-weight:600;color:var(--mut);flex:none}
.step button:active{background:var(--line);color:var(--bone)}
.step .val{flex:1;text-align:center;font-size:19px;font-weight:700;letter-spacing:-.02em;min-width:52px}
.step .val small{font-size:11px;font-weight:500;color:var(--mut);margin-left:2px}

/* ---------- set chips ---------- */
.sets{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  min-width:46px;height:42px;border-radius:10px;border:1px solid var(--line);
  background:var(--surf2);display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:16px;color:var(--dim);flex:1;
}
.chip.done{color:var(--bone);border-color:var(--glow)}
.chip.top{background:rgba(111,179,196,.14);border-color:var(--glow);color:var(--glow)}
.chip.cur{border-color:var(--amb);color:var(--amb)}

/* ---------- SIGNATURE: the plumb line. left and right read off a shared axis ---------- */
.plumb{margin:10px 0 2px}
.plumb .lbl{display:flex;justify-content:space-between;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.plumb .lbl .l{color:var(--amb)}
.plumb .lbl .r{color:var(--glow)}
.axis{position:relative;height:26px;display:flex;align-items:center;margin-top:5px}
.axis::before{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--bone);opacity:.55}
.axis .half{flex:1;height:12px;display:flex}
.axis .half.l{justify-content:flex-end}
.axis .bar{height:12px;border-radius:3px}
.axis .half.l .bar{background:var(--amb);border-radius:3px 0 0 3px}
.axis .half.r .bar{background:var(--glow);border-radius:0 3px 3px 0}
.axis .cap{position:absolute;font-size:11px;font-weight:700;top:4px}
.axis .cap.l{right:calc(50% + 6px);color:var(--amb)}
.axis .cap.r{left:calc(50% + 6px);color:var(--glow)}

/* ---------- flags ---------- */
.flag{display:flex;gap:9px;padding:11px 12px;border-radius:11px;font-size:13.5px;line-height:1.35;margin:8px 0;border:1px solid}
.flag b{font-weight:700}
.flag.stop{background:rgba(212,93,93,.12);border-color:rgba(212,93,93,.5);color:#F0B9B9}
.flag.up{background:rgba(127,176,105,.11);border-color:rgba(127,176,105,.45);color:#BEDDAB}
.flag.info{background:rgba(111,179,196,.09);border-color:rgba(111,179,196,.35);color:#BBDCE4}
.flag.disc{background:rgba(224,164,88,.1);border-color:rgba(224,164,88,.4);color:#EBCFA6}

/* ---------- pills / tabs ---------- */
.pills{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;-webkit-overflow-scrolling:touch}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;padding:9px 13px;border-radius:11px;border:1px solid var(--line);background:var(--surf);font-size:13.5px;font-weight:600;color:var(--mut)}
.pill.on{background:var(--bone);color:#0A0F14;border-color:var(--bone)}

/* ---------- inputs ---------- */
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;background:var(--surf2);border:1px solid var(--line);border-radius:11px;
  padding:12px;min-height:46px;outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--glow)}
textarea{min-height:74px;resize:vertical}
label.fld{display:block;margin:10px 0 0}
label.fld>span{display:block;margin-bottom:5px}

/* ---------- checklist ---------- */
.check{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0}
.box{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--dim);flex:none;display:flex;align-items:center;justify-content:center;font-size:15px;color:transparent}
.check.on .box{border-color:var(--ok);color:var(--ok)}
.check.on .t{color:var(--mut);text-decoration:line-through;text-decoration-color:var(--dim)}

/* ---------- table ---------- */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:700;padding:6px 4px;border-bottom:1px solid var(--line)}
th.n{text-align:right}
td{padding:8px 4px;border-bottom:1px solid var(--line)}
td.n{text-align:right;font-weight:600}

/* ---------- istogramma tonnellaggio ---------- */
.bars{display:flex;align-items:flex-end;gap:5px;height:66px}
.bars i{flex:1;border-radius:3px 3px 0 0;background:var(--surf2);min-height:3px;transition:none}
.bars i.on{background:linear-gradient(180deg,var(--glow) 0%,rgba(111,179,196,.28) 100%)}
.bars i.cur{background:linear-gradient(180deg,var(--amb) 0%,rgba(224,164,88,.3) 100%)}
.barlab{display:flex;gap:5px;margin-top:6px}
.barlab span{flex:1;text-align:center;font-size:9.5px;font-weight:700;color:var(--dim)}
.barlab span.cur{color:var(--amb)}

/* ---------- barra con fascia bersaglio ---------- */
.track{position:relative;height:10px;background:var(--surf2);border-radius:5px;overflow:hidden}
.track .band{position:absolute;top:0;bottom:0;background:rgba(127,176,105,.18)}
.track .fill{position:absolute;top:0;bottom:0;left:0;border-radius:5px;opacity:.9}
.track .tick{position:absolute;top:0;bottom:0;width:1px;background:var(--dim);opacity:.6}

/* ---------- riquadro statistica ---------- */
.stat .v{font-size:25px;font-weight:700;letter-spacing:-.03em;margin-top:1px;line-height:1.1}
.stat .v small{font-size:13px;font-weight:500;color:var(--mut);letter-spacing:0}
.delta{font-size:11.5px;font-weight:700}

/* ---------- spark ---------- */
.spark{display:flex;align-items:flex-end;gap:3px;height:38px}
.spark i{flex:1;background:var(--surf2);border-radius:2px 2px 0 0;min-height:2px}
.spark i.on{background:var(--glow)}
.spark i.amb{background:var(--amb)}

/* ---------- bottom nav ---------- */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:rgba(10,15,20,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
nav.tabs .in{display:flex;max-width:560px;margin:0 auto}
nav.tabs button{flex:1;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--dim)}
nav.tabs button.on{color:var(--bone)}
nav.tabs .ico{font-size:19px;line-height:1}
nav.tabs .lb{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}

/* ---------- toast / sheet ---------- */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:80;background:var(--bone);color:#0A0F14;
  padding:11px 16px;border-radius:11px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88%}
#toast.on{opacity:1}
.sheet{position:fixed;inset:0;z-index:70;background:rgba(4,7,10,.7);display:none;align-items:flex-end}
.sheet.on{display:flex}
.sheet .inner{background:var(--surf);width:100%;max-width:560px;margin:0 auto;border-radius:18px 18px 0 0;
  padding:16px 16px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;border-top:1px solid var(--line)}
.handle{width:38px;height:4px;background:var(--line);border-radius:2px;margin:0 auto 12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs"><div class="in" id="nav"></div></nav>
<div id="toast"></div>
<div class="sheet" id="sheet"><div class="inner" id="sheetIn"></div></div>
<script>

  /* storici, non più nel piano v5 */

  "RDL (Romanian Deadlift)":{g:"Gambe",t:"comp"}, "Bulgarian split squat (BW)":{g:"Gambe",t:"compl",uni:true},
  "Calf raise":{g:"Gambe",t:"iso"}, "Calf raise (BW)":{g:"Gambe",t:"iso"},
  "Band pull-down":{g:"Dorso",t:"compl",band:true}, "Rematore un braccio manubrio":{g:"Dorso",t:"compl",uni:true}, "Reverse Fly leggero":{g:"Spalle",t:"iso"},
  "Reverse Fly manubri":{g:"Spalle",t:"iso"}, "Kick back tricipiti":{g:"Tricipiti",t:"iso"},
  "Face pull con banda":{g:"Spalle",t:"iso"}, "Isometria push-up":{g:"Petto",t:"compl",sec:true},
  "Push-up piedi rialzati o deficit":{g:"Petto",t:"compl"}
};

var REST = {comp:120, compl:90, iso:60, core:45};
var BANDS = ["gialla","verde","azzurra","nera","rossa"];

/* ---------- riscaldamento: 6 minuti, blocco scoliosi ---------- */
var WARM = [
  {n:"Cat-cow", d:"8 ripetizioni lente · muovi lo sterno, non la testa"},
  {n:"Rotazioni toraciche", d:"6 per lato · bacino fermo, seduto sui talloni"},
  {n:"Bird-dog con pausa 3s", d:"8 per lato · unico lavoro diretto sugli estensori lombari"},
  {n:"Respirazione costale asimmetrica", d:"5 respiri · mano sn attiva sulle costole, mano dx passiva sul gibbo"},
  {n:"Attivazione del giorno", d:"", var:{A:"15 band pull-apart + 10 cerchi braccia", C:"15 band pull-apart + 10 cerchi braccia",

    T1:"10 glute bridge + 10 squat lenti", T2:"15 band pull-apart + 10 cerchi braccia"}}
];

/* ---------- i 4 giorni + 2 trasferte ---------- */
/* s = serie · lo/hi = range rep · L = carico di partenza · b = banda · u = unilaterale */
var BASEPLAN = {
 A:{name:"Spinta e trazione, forza", sede:"Casa", dischi:"20 › 20 › 14 › 16", min:60, ex:[

   {n:"Plank", s:3, lo:60, hi:60, sec:true, tip:"Conta i secondi a voce: non puoi contare in apnea."}
 ]},
 B:{name:"Gambe quadricipiti e core", sede:"Casa", dischi:"28 › 16", min:45, ex:[

   {n:"Calf raise monopodalico", s:3, lo:12, hi:12, u:true, tip:"A due gambe eri a RIR 3-4: non allenante."},
   {n:"Band tricep extension", s:2, lo:12, hi:12, b:"rossa"},
   {n:"Side plank", s:3, lo:40, hi:60, sec:true, u:true, asym:true, tip:"Sinistra 60s · destra 40s. Non è un errore: la convessità lombare è a sinistra."}
 ]},
 C:{name:"Volume upper", sede:"Casa", dischi:"20 › 16 › 16 › 16 › 8 › 6 › 6", min:70, ex:[
   {n:"Rematore manubri (volume)", s:4, lo:12, hi:12, L:20, tip:"Dalla rep 9 in poi il busto non deve raddrizzarsi. Meglio 10 pulite che 12 sporche."},
   {n:"Pullover manubrio", s:3, lo:12, hi:12, L:16, tip:"Espira mentre porti il peso dietro: impedisce meccanicamente l'inarcamento lombare."},
   {n:"Floor Press (volume)", s:3, lo:12, hi:12, L:16},
   {n:"French Press", s:3, lo:10, hi:10, L:16},
   {n:"Push-up", s:3, lo:12, hi:15, swap:"Manubri a 8 kg"},

   {n:"Face pull", s:3, lo:15, hi:15, L:6, tip:"Gomiti alti. Non saltarlo quando la sessione è lunga: è il più protettivo per la spalla."}
 ]},
 D:{name:"Catena posteriore e braccia", sede:"Casa", dischi:"14 › 16 › 16 › 8 › 8 › 6", min:60, ex:[
   {n:"Hip thrust con banda", s:3, lo:12, hi:15, b:"rossa", tip:"Va prima del RDL: i glutei spingono a fresco e la lombare non compensa."},
   {n:"Split-stance RDL", s:3, lo:8, hi:8, L:12, u:true, tip:"80% del peso sulla gamba avanti. Schiena che si arrotonda = stop immediato."},

 ]},
 T1:{name:"Trasferta · spinta e gambe", sede:"Trasferta", dischi:"solo bande", min:40, ex:[
   {n:"Push-up piedi rialzati con banda", s:4, lo:10, hi:12, b:"gialla", tip:"In hotel il rialzo è il bordo del letto o la valigia rigida."},

   {n:"Push-up stretti", s:3, lo:10, hi:12},
   {n:"Side plank", s:3, lo:40, hi:60, sec:true, u:true, asym:true}
 ]},

      try{ if(await this.probe(KEY+":probe","1")==="1") return this.mode; }
      catch(e){ this.err="artifact: "+(e&&e.message||e); }
    }
    if(this.mode==="artifact") this.fallback=true;
    this.mode="device";
    try{ if(await this.probe(KEY+":probe","1")==="1"){ localStorage.removeItem(KEY+":probe"); return this.mode; } }
    catch(e){ this.err=(this.err?this.err+" · ":"")+"device: "+(e&&e.message||e); }
    this.mode="none";
    return this.mode;
  },
  async get(){
    try{
      if(this.mode==="artifact"){ var r=await window.storage.get(KEY); return r? JSON.parse(r.value):null; }
      if(this.mode==="device"){ var v=localStorage.getItem(KEY); return v? JSON.parse(v):null; }
    }catch(e){ this.err="lettura: "+(e&&e.message||e); }
    return null;
  },
  async set(o){
    if(this.mode==="none"){ this.ok=false; return false; }
    try{
      o.savedAt = new Date().toISOString();
      var s=JSON.stringify(o); this.bytes=s.length;
      if(this.mode==="artifact") await window.storage.set(KEY,s); else localStorage.setItem(KEY,s);
      /* rilettura di verifica */
      var back = this.mode==="artifact" ? (await window.storage.get(KEY)||{}).value : localStorage.getItem(KEY);
      if(!back || back.length!==s.length){ this.ok=false; this.err="verifica fallita"; return false; }
      this.ok=true; this.last=new Date(); this.err=""; return true;
    }catch(e){ this.ok=false; this.err="scrittura: "+(e&&e.message||e); return false; }
  }
};
async function save(){ var r=await Store.set(S);
  if(!r && !Store._shown && typeof PLAN!=="undefined" && PLAN){ Store._shown=true; render(); }
  return r; }

/* ---------- date ---------- */
var W0 = new Date(2026,6,13); /* lunedì della settimana 24 */
function d2s(d){ var p=n=>String(n).padStart(2,"0"); return p(d.getDate())+"/"+p(d.getMonth()+1)+"/"+d.getFullYear(); }
function s2d(s){ var a=String(s).split("/"); return new Date(+a[2],+a[1]-1,+a[0]); }
function weekOf(s){ return 24 + Math.floor((s2d(s)-W0)/604800000); }
function today(){ return d2s(new Date()); }
function dayName(s){ return ["Domenica","Lunedì","Martedì","Mercoledì","Giovedì","Venerdì","Sabato"][s2d(s).getDay()]; }
function ago(s){ var n=Math.round((new Date().setHours(0,0,0,0)-s2d(s))/86400000);
  return n===0?"oggi":n===1?"ieri":n+" giorni fa"; }

/* ---------- seed ---------- */
function parse(txt, keys){
  return txt.trim().split("\n").filter(l=>l.trim()).map(function(l){
    var p=l.split("|"), o={};
    keys.forEach(function(k,i){ o[k]= p[i]===undefined?"":p[i].trim(); });
    return o;
  });
}
function seed(){
  S.log = parse(SEED_LOG,["w","date","day","ex","side","band","load","reps","rir","top","note"]).map(function(r,i){

      load: r.load?+r.load:0, reps: r.reps?r.reps.split(".").map(Number):[],
      rir: r.rir===""?null:+r.rir, top: r.top==="1", note:r.note};
  });

    return {id:"s"+i, w:+r.w, date:r.date, day:r.day, sede:r.sede, mod:r.mod, min:+r.min||0,
      en:+r.en||0, warm:r.warm==="1", sig:r.sig==="1", note:r.note};
  });
  S.mis = parse(SEED_MIS,["w","date","peso","torace","bic","coscia","vita","note"]).map(function(r){

      coscia:+r.coscia||null, vita:+r.vita||null, note:r.note};

  S.ben = parse(SEED_BEN,["date","w","refl","resp","camm","hrv","read","sonno","alc","note"]).map(function(r){
    return {date:r.date, w:+r.w, refl:r.refl===""?null:+r.refl, resp:r.resp==="1",
      camm:r.camm===""?null:+r.camm, hrv:+r.hrv||null, read:+r.read||null,
      sonno:+r.sonno||null, alc:r.alc==="1", note:r.note};

/* ---------- lettura storico ---------- */
var ALIAS={"Reverse Fly":["Reverse Fly manubri","Reverse Fly leggero"]};
var PLAN_W0=30; /* prima settimana del Piano Unico v5 */
function meta(n){ return EX[n] || {g:"—", t:"compl"}; }
function hist(name, side){
  var names=[name];
  return S.log.filter(r=>names.indexOf(r.ex)>=0 && (side===undefined || r.side===side))
              .sort((a,b)=>s2d(a.date)-s2d(b.date));
}
/* storico esteso: include i nomi con cui l'esercizio era loggato prima del piano v5 */
function histAll(name){
  var names=[name].concat(ALIAS[name]||[]);
  return S.log.filter(r=>names.indexOf(r.ex)>=0).sort((a,b)=>s2d(a.date)-s2d(b.date));
}
/* un carico che non hai chiuso non diventa il nuovo standard */
function suggestLoad(def){
  var h=hist(def.n).filter(r=>r.load>0);
  if(!h.length) return def.L||0;
  var last=h[h.length-1];
  if(def.L && last.load>def.L && !last.top) return def.L;
  return last.load;
}
function lastLoad(name, fallback){
  var h = hist(name).filter(r=>r.load>0);
  return h.length ? h[h.length-1].load : (fallback||0);
}
function lastBand(name, fallback){
  var h = hist(name).filter(r=>r.band);
  return h.length ? h[h.length-1].band : (fallback||"");
}
function lastTwo(name){
  var h = hist(name), seen=[], out=[];
  for(var i=h.length-1;i>=0 && out.length<2;i--){
    if(seen.indexOf(h[i].date)<0){ seen.push(h[i].date); out.push(h[i]); }
  }
  return out;
}
/* soglia doppia progressione: top del range su ≥3 serie su 4, o 3 su 3, o 2 su 2 */
function isTop(reps, hi, sets){
  if(!reps || !reps.length) return false;
  var need = sets>=3 ? 3 : sets;
  return reps.filter(r=>r>=hi).length >= Math.min(need, reps.length) && reps.length>=Math.min(sets,need);
}

/* ---------- il motore di progressione ---------- */
function readiness(exDef){
  var n=exDef.n, m=meta(n), h=histAll(n), out={ready:false, why:"", cap:false};
  if(!h.length) return out;
  var dates=[...new Set(h.map(r=>r.date))].slice(-2);
  if(dates.length<2) return out;
  var ok = dates.every(function(d){
    var rows=h.filter(r=>r.date===d);
    if(exDef.u){ return rows.every(r=>isTop(r.reps, exDef.hi, exDef.s)); }
    return rows.some(r=>isTop(r.reps, exDef.hi, exDef.s));
  });
  if(!ok) return out;
  var cur = exDef.b ? lastBand(n, exDef.b) : suggestLoad(exDef);
  if(exDef.b){
    var i=BANDS.indexOf(cur);
    if(i>=BANDS.length-1){ return {ready:true, cap:true, why:"Banda rossa: aggiungi una serie o rallenta il ritorno a 3s"}; }
    return {ready:true, why:"banda "+cur+" → "+BANDS[i+1], next:BANDS[i+1]};
  }
  if(m.cap && cur>=m.cap){
    var alt = n.indexOf("Reverse Fly")===0 ? "6 kg è tetto assoluto finché non hai una valutazione. Non salire."
            : n.indexOf("Floor Press")===0 ? "sei al tetto: allunga la discesa a 3-4 secondi"
            : n.indexOf("Curl")===0||n.indexOf("Hammer")===0 ? "tetto 8 kg: chiudi 4×10 pulite per due sessioni prima di salire"
            : "tetto raggiunto: progredisci con tempo o ripetizioni";
    return {ready:true, cap:true, why:alt};
  }
  if(!cur) return {ready:true, why:"passa alla variante successiva della scala"};
  var step = m.step||2;
  return {ready:true, why:cur+" → "+(cur+step)+" kg", next:cur+step};
}

/* ---------- KPI settimanali ---------- */
function weeks(){ return [...new Set(S.sess.map(s=>s.w))].sort((a,b)=>a-b); }
function kpi(w){
  var ss=S.sess.filter(s=>s.w===w), ls=S.log.filter(r=>r.w===w);
  var dur=ss.filter(s=>s.min).map(s=>s.min), en=ss.filter(s=>s.en).map(s=>s.en);
  var ton=ls.reduce((a,r)=>a + r.load*(r.reps.reduce((x,y)=>x+y,0)), 0);
  var tot=ls.filter(r=>!meta(r.ex).sec).length, top=ls.filter(r=>r.top && !meta(r.ex).sec).length;
  /* serie per gruppo: un esercizio unilaterale è UNA serie per il muscolo,
     non due. Le righe sinistra e destra descrivono lo stesso lavoro. */
  var grp={};
  ls.forEach(function(r){ var g=meta(r.ex).g;
    grp[g]=(grp[g]||0) + (r.side ? r.reps.length/2 : r.reps.length); });
  Object.keys(grp).forEach(function(g){ grp[g]=Math.round(grp[g]); });
  /* asimmetria: solo esercizi loggati per lato */
  var sx=0,dx=0;
  ls.forEach(function(r){ var t=r.reps.reduce((a,b)=>a+b,0); if(r.side==="S")sx+=t; if(r.side==="D")dx+=t; });
  var asim = (sx+dx)? Math.round(Math.abs(sx-dx)/((sx+dx)/2)*100) : 0;
  var b=S.ben.filter(x=>x.w===w && x.refl!==null);
  var m=S.mis.filter(x=>x.w===w)[0];
  return {w:w, n:ss.length, ader:Math.round(ss.length/4*100),
    dur:dur.length?Math.round(dur.reduce((a,b)=>a+b,0)/dur.length):null,
    en:en.length?+(en.reduce((a,b)=>a+b,0)/en.length).toFixed(1):null,
    top: tot? Math.round(top/tot*100):null, ton:Math.round(ton), grp:grp, asim:asim,
    warm: ss.filter(s=>s.warm).length, sig: ss.filter(s=>s.sig).length,
    refl: b.length? +(b.reduce((a,x)=>a+x.refl,0)/b.length).toFixed(1) : null,
    peso: m?m.peso:null, vt: (m&&m.vita&&m.torace)? +(m.vita/m.torace).toFixed(3):null};
}

/* ---------- diagnosi: adeguatezza di carichi ed esercizi ---------- */
var TGT={Petto:[10,16],Dorso:[10,16],Spalle:[10,16],Bicipiti:[10,16],Tricipiti:[10,16],Gambe:[10,18],Core:[6,12]};
function diagnose(){
  var out=[], ws=weeks(), lastFull = ws.filter(w=>w>=PLAN_W0 && S.sess.filter(s=>s.w===w).length>=4).pop();
  /* 1. stallo o carico troppo alto */
  var seen={};
  Object.keys(PLAN).forEach(function(d){
    PLAN[d].ex.forEach(function(e){
      if(seen[e.n]||e.sec) return; seen[e.n]=1;
      var h=hist(e.n); if(h.length<3) return;
      var dates=[...new Set(h.map(r=>r.date))].slice(-3);
      if(dates.length<3) return;
      var rows=dates.map(d2=>h.filter(r=>r.date===d2)[0]);
      var sameLoad = rows.every(r=>r.load===rows[0].load) && rows[0].load>0;
      var neverTop = rows.every(r=>!r.top);
      if(sameLoad && neverTop) out.push({k:"stallo", t:e.n,
        m:"Tre sessioni a "+rows[0].load+" kg senza mai chiudere il top del range. Il carico è sopra la capacità attuale: scendi di 2 kg e ricostruisci."});
      var hiRir = rows.filter(r=>r.rir!==null && r.rir>=3).length;
      if(hiRir>=2) out.push({k:"leggero", t:e.n,
        m:"RIR 3 o più su due sessioni: non è allenante. Sali di carico o passa alla variante successiva."});
      var last=rows[rows.length-1];
      if(last.reps.length>=3){
        var drop = last.reps[0]-last.reps[last.reps.length-1];
        if(drop>=3) out.push({k:"crollo", t:e.n,
          m:"Ultima sessione "+last.reps.join("-")+": perdi "+drop+" ripetizioni dalla prima all'ultima serie. Prima allunga il recupero, poi valuta il carico."});
      }
    });
  });
  /* 2. volume per gruppo — solo su una settimana piena del piano corrente */
  if(!lastFull) out.push({k:"attesa", t:"Volume non ancora valutabile",
    m:"Serve una settimana completa (4 sessioni) sul Piano Unico v5. Poi il confronto con i target diventa affidabile."});
  if(lastFull){
    var k=kpi(lastFull);
    Object.keys(TGT).forEach(function(g){
      var v=k.grp[g]||0, t=TGT[g];
      if(v<t[0]) out.push({k:"volume", t:g, m:"Settimana "+lastFull+": "+v+" serie, sotto il minimo di "+t[0]+"."});
      if(v>t[1]) out.push({k:"volume", t:g, m:"Settimana "+lastFull+": "+v+" serie, sopra il massimo di "+t[1]+". Toglile da qui, non aggiungerle altrove."});
    });
    if(k.dur && k.dur>75) out.push({k:"durata", t:"Durata media "+k.dur+" min",
      m:"Oltre i 75 minuti è il principale fattore di abbandono. Cambia i dischi dentro il recupero, non dopo."});
    if(k.asim>10) out.push({k:"asim", t:"Asimmetria "+k.asim+"%", m:"Differenza fra ripetizioni sx e dx. Pareggia sempre sul lato debole."});
  }
  /* 3. segnali articolari */
  var sig=S.sess.filter(s=>s.sig).slice(-3);
  if(sig.length) out.push({k:"segnale", t:"Ultimo segnale articolare: "+sig[sig.length-1].date,
    m:sig[sig.length-1].note||"Registrato nel tracker."});
  /* 4. composizione */
  var m2=S.mis.filter(x=>x.vita&&x.torace).slice(-2);
  if(m2.length===2){
    var a=m2[0].vita/m2[0].torace, b=m2[1].vita/m2[1].torace;
    if(b>a+0.005 && m2[1].peso>=m2[0].peso) out.push({k:"comp", t:"Vita/Torace "+b.toFixed(3),
      m:"Salito da "+a.toFixed(3)+" mentre il peso non scendeva. Se si conferma alla prossima misura, il surplus è troppo aggressivo."});
  }
  /* 5. riscaldamento */
  if(lastFull){
    var kk=kpi(lastFull);
    if(kk.warm<kk.n) out.push({k:"warm", t:"Riscaldamenti "+kk.warm+"/"+kk.n,
      m:"Il riscaldamento contiene il blocco scoliosi. Se scende, lo perdi senza accorgertene."});
  }
  return out;
}

/* ---------- export ---------- */
function tsv(){

  return L.join("\n");

function copy(txt, msg){
  var done=function(){ toast(msg||"Copiato"); };
  if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(txt).then(done, fallback); }
  else fallback();
  function fallback(){
    var ta=document.createElement("textarea"); ta.value=txt;
    ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta);
    ta.select(); try{ document.execCommand("copy"); done(); }catch(e){ toast("Copia non riuscita"); }

}
function download(name, txt, type){

/* ============================================================
   AGGIORNAMENTI DEL PIANO
   Il piano vivo = piano base + patch applicate in ordine.
   Una patch arriva dalla chat, si incolla, si vede l'anteprima,
   si applica. Nessun esercizio entra senza che tu lo confermi.
   ============================================================ */
var PLAN = null;
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function buildPlan(){
  var P = clone(BASEPLAN);
  (S.patches||[]).forEach(function(pt){ (pt.ops||[]).forEach(function(op){ applyOp(P, op); }); });
  return P;
}
function applyOp(P, op){
  var day = P[op.d]; if(!day) return;
  if(op.meta && op.ex && op.ex.n) EX[op.ex.n] = Object.assign({g:"—",t:"compl"}, op.meta);
  if(op.op==="del"){ day.ex = day.ex.filter(e=>e.n!==op.n); return; }
  if(op.op==="add"){
    if(day.ex.some(e=>e.n===op.ex.n)) return;
    var at = op.after ? day.ex.findIndex(e=>e.n===op.after)+1 : day.ex.length;
    day.ex.splice(at, 0, op.ex); return;
  }
  if(op.op==="set"){
    var e = day.ex.filter(x=>x.n===op.n)[0]; if(!e) return;
    ["s","lo","hi","L","b","tip","swap","u","sec","asym"].forEach(function(k){
      if(op[k]!==undefined) e[k]=op[k];
    });
    return;
  }
  if(op.op==="dischi"){ day.dischi = op.v; return; }
}
/* anteprima leggibile prima di applicare */
function previewPatch(pt){
  return (pt.ops||[]).map(function(o){
    if(o.op==="del") return "Togli "+o.n+" dal giorno "+o.d;
    if(o.op==="add") return "Aggiungi "+o.ex.n+" al giorno "+o.d+(o.after?" dopo "+o.after:"");
    if(o.op==="dischi") return "Sequenza dischi giorno "+o.d+" → "+o.v;
    var ch=[];
    if(o.s!==undefined) ch.push(o.s+" serie");
    if(o.lo!==undefined||o.hi!==undefined) ch.push("range "+(o.lo!==undefined?o.lo:"?")+"-"+(o.hi!==undefined?o.hi:"?"));
    if(o.L!==undefined) ch.push(o.L+" kg");
    if(o.b!==undefined) ch.push("banda "+o.b);
    if(o.tip!==undefined) ch.push("nota tecnica");
    if(o.swap!==undefined) ch.push("promemoria dischi");
    return o.n+" (giorno "+o.d+"): "+(ch.length?ch.join(", "):"nessun cambio");
  });
}

/* ---------- promemoria backup ----------
   Scade per tempo (30 giorni) o per lavoro accumulato (8 sessioni).
   Quello che conta non è il calendario: è quanto perderesti. */
function backupState(){
  var ref = S.lastBackup || S.installed || today();
  var days = Math.round((s2d(today())-s2d(ref))/86400000);
  var since = S.sess.filter(x=>s2d(x.date) > s2d(ref)).length;
  /* con il foglio collegato lo storico è già al sicuro: il .json serve
     solo per il piano e il check simmetria, che nel foglio non vanno */
  var safe = (typeof SYNC!=="undefined" && SYNC.on() && SYNC.state==="ok");
  return {ref:ref, days:days, since:since, never:!S.lastBackup, safe:safe,
          due: safe ? days>=60 : (days>=30 || since>=8),
          soon: safe ? days>=45 : (days>=21 || since>=6)};
}

/* identificativo di riga: due esercizi uguali nella stessa sessione restano distinti */
var _uid=0;
function uid(p){ _uid++; return p+"-"+Date.now().toString(36)+"-"+_uid; }
/* ============================================================
   ANIMAZIONI SCHEMATICHE
   Solo dove l'errore è una GEOMETRIA visibile, non una sensazione.
   Le lunghezze dei segmenti restano costanti: dove serve, il
   ginocchio è calcolato dalla posizione dell'anca, non disegnato.
   ============================================================ */
function r1(n){ return Math.round(n*10)/10; }
function ln(x1,y1,x2,y2,o){ return '<line x1="'+r1(x1)+'" y1="'+r1(y1)+'" x2="'+r1(x2)+'" y2="'+r1(y2)+'" '+(o||"")+'/>'; }
function pl(p,o){ return '<polyline points="'+p.map(q=>r1(q[0])+","+r1(q[1])).join(" ")+'" '+(o||"")+'/>'; }
function ci(x,y,r,o){ return '<circle cx="'+r1(x)+'" cy="'+r1(y)+'" r="'+r+'" '+(o||"")+'/>'; }
function rc(x,y,w,h,o){ return '<rect x="'+r1(x)+'" y="'+r1(y)+'" width="'+r1(w)+'" height="'+r1(h)+'" rx="2" '+(o||"")+'/>'; }
function pa(d,o){ return '<path d="'+d+'" '+(o||"")+'/>'; }
var DBF='fill="currentColor" stroke="none"', HEADF='fill="var(--bg)"';
var GH='stroke="var(--dim)" stroke-width="1" stroke-dasharray="3 4" fill="none"';

/* ginocchio da caviglia e anca, lunghezze fisse */
function knee(ax,ay,hx,hy,l1,l2){
  var dx=hx-ax, dy=hy-ay, dd=Math.sqrt(dx*dx+dy*dy), ux=dx/dd, uy=dy/dd;
  var d=Math.min(dd, l1+l2-0.5);
  var a=(l1*l1-l2*l2+d*d)/(2*d), h=Math.sqrt(Math.max(0,l1*l1-a*a));
  return {x: ax+a*ux + h*uy, y: ay+a*uy - h*ux};
}
function db(x,y){ return rc(x-7.5,y-3,15,6,DBF); }

/* 1. Split-stance RDL — hinge contro squat */
function aHinge(ox,t,w){
  var ay=152, S=44, T=46, TO=54, AR=30, hx,hy,th;
  if(!w){ hx=ox+4+34*t; hy=ay-88+12*t; th=(8+58*t)*Math.PI/180; }
  else  { hx=ox+4+4*t;  hy=ay-88+40*t; th=(8+14*t)*Math.PI/180; }
  var k=knee(ox,ay,hx,hy,S,T);
  var sx=hx-Math.sin(th)*TO, sy=hy-Math.cos(th)*TO;
  return ln(hx,hy,ox+44,ay,'stroke-width="2.4" opacity=".5"')+
    pl([[ox,ay],[k.x,k.y],[hx,hy]])+ ln(hx,hy,sx,sy)+ ln(sx,sy,sx,sy+AR,'stroke-width="2.6"')+
    ci(sx-Math.sin(th)*13, sy-Math.cos(th)*13, 9, HEADF)+ db(sx,sy+AR);
}
/* 2. Box Squat — anca indietro contro ginocchio avanti e tallone che si alza */
function aBox(ox,t,w){
  var ay=152, S=44, T=46, TO=52, hx,hy,th,heel=0;
  if(!w){ hx=ox+8+30*t; hy=ay-88+40*t; th=(10+32*t)*Math.PI/180; }
  else  { hx=ox+6+2*t;  hy=ay-88+40*t; th=(10+10*t)*Math.PI/180; heel=6*t; }
  var k=knee(ox,ay-heel,hx,hy,S,T);
  var sx=hx-Math.sin(th)*TO, sy=hy-Math.cos(th)*TO;
  return rc(ox+24,112,40,40,'fill="var(--surf2)" stroke="var(--dim)" stroke-width="1.5"')+
    ln(ox-18,ay,ox+8,ay-heel,'stroke-width="2.6"')+
    pl([[ox,ay-heel],[k.x,k.y],[hx,hy]])+ ln(hx,hy,sx,sy)+
    ln(sx,sy,sx+6,sy+28,'stroke-width="2.4"')+
    ci(sx-Math.sin(th)*13, sy-Math.cos(th)*13, 9, HEADF)+ db(sx+6,sy+28);
}
/* 3. Floor Press — gomiti a 45° contro 90°, vista dall'alto */
function aPress(ox,t,w){
  var cy=64, UA=30, FA=26, ang=(w? 18+72*t : 18+27*t)*Math.PI/180, o="";
  o+=ln(ox,cy+6,ox,cy+78,'stroke-width="9" opacity=".8" stroke-linecap="butt"');
  o+=ci(ox,cy-6,10,HEADF);
  o+=ln(ox,cy+22,ox,cy+96,GH);
  [-1,1].forEach(function(s){
    var shx=ox+s*8, shy=cy+18;
    var ex=shx+s*Math.sin(ang)*UA, ey=shy+Math.cos(ang)*UA;
    var hx=ex-s*0.24*FA, hy=ey-0.97*FA;
    o+=ln(shx,shy,ex,ey)+ln(ex,ey,hx,hy,'stroke-width="3"')+db(hx,hy);
    o+=ci(ex,ey,3.2,'fill="currentColor" stroke="none"');
  });
  return o;
}
/* colonna supina: piatta a terra oppure inarcata */
function spine(px,py,sx,sy,lift){
  var mx=(px+sx)/2, my=(py+sy)/2-lift*2;
  return pa("M"+r1(px)+","+r1(py)+" Q"+r1(mx)+","+r1(my)+" "+r1(sx)+","+r1(sy));
}
/* 4. Pullover — costole basse contro lombare che si stacca */
function aPullover(ox,t,w){
  var fl=152, lift=w? 13*t : 0;
  var px=ox+26, py=fl-11, sx=ox-14, sy=fl-11;
  var ph=(6+96*t)*Math.PI/180, ah=38;
  var hx=sx-Math.sin(ph)*ah, hy=sy-Math.cos(ph)*ah;
  var o=ln(ox-30,fl,ox+66,fl,'stroke="var(--line)" stroke-width="1.5"')+
    spine(px,py,sx,sy,lift)+ pl([[px,py],[ox+50,fl-34],[ox+62,fl]])+
    ln(sx,sy,hx,hy)+ db(hx,hy)+ ci(sx-15,sy-5,9,HEADF);
  if(lift>3) o+=pa("M"+r1(ox+2)+","+r1(fl-3)+" q11,-"+r1(lift+3)+" 22,0",
    'stroke="var(--alert)" stroke-width="1.6" stroke-dasharray="2 3" fill="none"');
  return o;
}
/* 5. Dead bug — lombare a terra contro lombare che si alza */
function aDead(ox,t,w){
  var fl=152, lift=w? 14*t : 0;
  var px=ox+22, py=fl-11, sx=ox-18, sy=fl-11;
  var kx=px-6+10*t, ky=py-40+16*t, fx=kx-14-20*t, fy=ky+34+4*t;
  var ph=(4+92*t)*Math.PI/180, ah=34;
  var hx=sx-Math.sin(ph)*ah, hy=sy-Math.cos(ph)*ah;
  var o=ln(ox-34,fl,ox+56,fl,'stroke="var(--line)" stroke-width="1.5"')+
    spine(px,py,sx,sy,lift)+
    ln(px,py,px+15,py-37,'stroke-width="2.4" opacity=".45"')+
    pl([[px,py],[kx,ky],[fx,fy]])+
    ln(sx,sy,hx,hy)+ ci(sx-15,sy-4,9,HEADF);
  if(lift>3) o+=pa("M"+r1(ox-2)+","+r1(fl-3)+" q11,-"+r1(lift+3)+" 22,0",
    'stroke="var(--alert)" stroke-width="1.6" stroke-dasharray="2 3" fill="none"');
  return o;
}
/* 6. Hip thrust — sale il bacino contro si inarca la lombare */
function aThrust(ox,t,w){
  var fl=152, shx=ox-30, shy=118, kx=ox+30, ky=116, fx=ox+36;
  var px=ox+2, py = w ? fl-10-16*t : fl-10-30*t;
  var arch = w ? 13*t : 0;
  var mx=(shx+px)/2, my=(shy+py)/2-arch;
  return ln(ox-6,fl,ox+46,fl,'stroke="var(--line)" stroke-width="1.5"')+
    rc(ox-58,118,30,34,'fill="var(--surf2)" stroke="var(--dim)" stroke-width="1.5"')+
    ln(shx,shy,kx,ky,GH)+
    pa("M"+r1(shx)+","+r1(shy)+" Q"+r1(mx)+","+r1(my)+" "+r1(px)+","+r1(py))+
    pl([[px,py],[kx,ky],[fx,fl]])+
    ci(shx-13,shy-4,9,HEADF);
}
/* 7. Side plank — linea retta contro bacino che cala */
function aPlank(ox,t,w){
  var elx=ox-36, ely=150, shx=ox-32, shy=112, ax=ox+54, ay=146;
  var sag = w ? 20*t : 0;
  var hx=(shx+ax)/2+4, hy=(shy+ay)/2+sag;
  return ln(ox-50,152,ox+62,152,'stroke="var(--line)" stroke-width="1.5"')+
    ln(shx,shy,ax,ay,GH)+
    ln(elx,ely,shx,shy,'stroke-width="3"')+ ln(elx-13,ely,elx+6,ely,'stroke-width="3"')+
    pl([[shx,shy],[hx,hy],[ax,ay]])+
    ci(shx-11,shy-7,9,HEADF);
}
/* 8. Bird-dog — piede all'altezza dell'anca contro piede più alto */
function aBird(ox,t,w){
  var sh=[ox-34,114], hip=[ox+26,114];
  var sag = w ? 9*t : 0, lg = w ? -17*t : 0;
  var mx=(sh[0]+hip[0])/2, my=114+sag;
  return ln(ox-46,152,ox+46,152,'stroke="var(--line)" stroke-width="1.5"')+
    ln(ox+20,114,ox+72,114,GH)+
    pa("M"+r1(sh[0])+","+r1(sh[1])+" Q"+r1(mx)+","+r1(my)+" "+r1(hip[0])+","+r1(hip[1]))+
    ln(sh[0],sh[1],ox-34,152)+ ln(hip[0],hip[1],ox+26,152)+
    ln(ox+26,152,ox+40,152,'stroke-width="2.4" opacity=".5"')+
    ln(sh[0],sh[1],sh[0]-32-6*t,sh[1]-2)+
    ln(hip[0],hip[1],hip[0]+42,hip[1]+lg)+
    ci(sh[0]-14,sh[1]+6,8.5,HEADF);
}

var animRAF=null, animT0=0, animKey=null, animLast=0;
function animBlock(n){
  if(!ANIM[n]) return "";
  return '<div class="card" id="animBox" style="margin-top:14px;padding:10px 10px 4px"></div>';
}
function animDraw(n,t){
  var k=ANIM[n], box=document.getElementById("animBox"); if(!box||!k) return;
  box.innerHTML='<svg viewBox="0 0 340 200" style="width:100%;height:auto;display:block">'+
    '<line x1="170" y1="14" x2="170" y2="166" stroke="var(--line)" stroke-width="1" stroke-dasharray="3 6"/>'+
    '<g stroke="var(--glow)" color="var(--glow)" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round">'+k.f(88,t,false)+'</g>'+
    '<g stroke="var(--alert)" color="var(--alert)" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round">'+k.f(252,t,true)+'</g>'+
    '<text x="88" y="180" fill="var(--glow)" font-size="11" font-weight="700" text-anchor="middle">'+esc(k.a)+'</text>'+
    '<text x="88" y="194" fill="var(--mut)" font-size="9.5" text-anchor="middle">'+esc(k.a2)+'</text>'+

function startAnim(n){
  stopAnim(); animKey=n;
  var red = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(red){ animDraw(n,0.9); return; }
  animT0=Date.now(); animLast=0;
  (function loop(){
    var now=Date.now();
    if(now-animLast>42){ animLast=now;
      animDraw(animKey,(1-Math.cos(((now-animT0)%3400)/3400*2*Math.PI))/2); }
    animRAF=requestAnimationFrame(loop);
  })();
}
function stopAnim(){ if(animRAF){ cancelAnimationFrame(animRAF); animRAF=null; } animKey=null; }
/* ============================================================
   COLLEGAMENTO AL FOGLIO
   Il foglio è la memoria: si legge all'avvio, si scrive a fine
   sessione. La memoria locale diventa solo una copia di comodo,
   e se sparisce non succede niente.
   Lettura via JSONP (aggira le restrizioni cross-origin di Apps
   Script), scrittura via POST text/plain (richiesta "semplice",
   quindi senza preflight).
   ============================================================ */
var SYNC = {
  busy:false, last:null, state:"", err:"", pending:0, repaired:0,
  cfg(){ return S.sync || {}; },
  on(){ return !!(S.sync && S.sync.url); },

  jsonp(url){
    return new Promise(function(res,rej){
      var cb="rch_"+Math.random().toString(36).slice(2), s=document.createElement("script");
      var t=setTimeout(function(){ done(); rej(new Error("nessuna risposta entro 20s")); },20000);
      function done(){ clearTimeout(t); try{ delete window[cb]; }catch(e){ window[cb]=undefined; }
        if(s.parentNode) s.parentNode.removeChild(s); }
      window[cb]=function(d){ done(); res(d); };
      s.onerror=function(){ done(); rej(new Error("URL non raggiungibile")); };
      s.src=url+(url.indexOf("?")<0?"?":"&")+"callback="+cb;
      document.body.appendChild(s);
    });
  },
  async pull(){
    var c=this.cfg(), u=c.url+"?k="+encodeURIComponent(c.secret||"");
    var d=null, e1="";
    try{ var r=await fetch(u,{redirect:"follow"}); d=JSON.parse(await r.text()); }
    catch(err){ e1=String(err.message||err); }
    if(!d){ try{ d=await this.jsonp(u); }
      catch(err2){ throw new Error(e1? (e1+" · "+(err2.message||err2)) : String(err2.message||err2)); } }
    if(!d || !d.ok) throw new Error(d && d.err ? d.err : "risposta non valida");
    return d;
  },

  /* diagnosi: quale strato si rompe */
  async diagnose(){
    var c=this.cfg(), out=[], u=(c.url||"")+"?k="+encodeURIComponent(c.secret||"");
    var framed = (function(){ try{ return window.self!==window.top; }catch(e){ return true; } })();
    out.push({t:"Dove gira l'app", v: framed? "dentro un contenitore isolato (iframe)" : "pagina propria", bad:framed});
    if(!c.url){ out.push({t:"URL", v:"non configurato", bad:true}); return out; }
    out.push({t:"Forma dell'URL", v: /^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(c.url)?
      "corretta" : "sospetta: deve essere /macros/s/.../exec", bad: !/\/exec$/.test(c.url)});
    try{ var r=await fetch(u,{redirect:"follow"}); var txt=await r.text();
      try{ var j=JSON.parse(txt);
        out.push({t:"Lettura via fetch", v: j.ok? "riuscita" : "il foglio risponde: "+j.err, bad:!j.ok});
      }catch(e){ out.push({t:"Lettura via fetch", v:"risposta non è JSON (probabile pagina di login: accesso non impostato su Chiunque)", bad:true}); }
    }catch(e){ out.push({t:"Lettura via fetch", v:"bloccata — "+String(e.message||e), bad:true}); }
    try{ var j2=await this.jsonp(u);
      out.push({t:"Lettura via script", v: (j2&&j2.ok)? "riuscita" : "il foglio risponde: "+((j2&&j2.err)||"esito negativo"), bad: !(j2&&j2.ok)});
    }catch(e){ out.push({t:"Lettura via script", v:"bloccata — "+String(e.message||e), bad:true}); }
    return out;
  },
  async push(payload){
    var c=this.cfg();
    payload.secret=c.secret||"";
    var r=await fetch(c.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify(payload), redirect:"follow"});
    var t=await r.text();
    var d=JSON.parse(t);
    if(!d.ok) throw new Error(d.err||"scrittura rifiutata");
    return d;
  },

  /* riconosce una riga che Sheets ha convertito in data o durata */
  parseReps(v){
    var s=String(v==null?"":v).trim();
    if(!s) return [];
    if(/[TZ:]/.test(s) || /^\d{4}-\d{2}-\d{2}/.test(s) || /^\d{1,2}\/\d{1,2}\//.test(s)) return null;
    var a=s.split(/[|.,;]/).map(function(x){ return parseInt(x,10); }).filter(function(x){ return !isNaN(x); });
    return a.length ? a : null;
  },
  /* fonde due elenchi: il foglio ha ragione sulle righe che conosce,
     ma quello che è nato in locale e non è ancora salito non si tocca */
  fuse(remote, local, key){
    var seen={}; remote.forEach(function(r){ seen[key(r)]=1; });
    var extra = local.filter(function(r){ return !seen[key(r)]; });
    this.pending += extra.length;
    return remote.concat(extra).sort(function(a,b){ return s2d(a.date)-s2d(b.date); });
  },
  /* dal foglio allo stato dell'app */
  adopt(d){
    this.pending = 0; this.repaired = 0;
    var self=this;
    var byId = function(r){ return String(r.id||""); }, byDate = function(r){ return String(r.date||""); };
    var locale = {}; S.log.forEach(function(r){ if(r.id) locale[r.id]=r; });
    if(d.log)  S.log  = this.fuse(d.log.map(function(r){
      var rp = self.parseReps(r.reps);
      var loc = locale[String(r.id||"")];
      /* riga alterata dal foglio: se ho l'originale in locale, tengo quello */
      if(rp===null){ self.repaired++; if(loc) return loc; rp=[]; }
      return {id:r.id||uid("l"), w:+r.w||weekOf(r.date), date:r.date, day:r.day, ex:r.ex, side:r.side||"", band:r.band||"",
        load:+r.load||0, reps:rp,
        rir:(r.rir===""||r.rir==null)?null:+r.rir, top:r.top===true||r.top==="Sì"||r.top===1, note:r.note||""};
    }), S.log, byId);
    if(d.sess) S.sess = this.fuse(d.sess.map(function(r){
      return {id:r.id||uid("s"), w:+r.w||weekOf(r.date), date:r.date, day:r.day, sede:r.sede, mod:r.mod, min:+r.min||0,
        en:+r.en||0, warm:r.warm===true||r.warm==="Sì", sig:r.sig===true||r.sig==="Sì", note:r.note||""};
    }), S.sess, byId);
    if(d.mis)  S.mis  = this.fuse(d.mis.map(function(r){
      return {w:+r.w||weekOf(r.date), date:r.date, peso:num(r.peso), torace:num(r.torace),
        bic:num(r.bic), coscia:num(r.coscia), vita:num(r.vita), note:r.note||""};
    }), S.mis, byDate);
    if(d.ben)  S.ben  = this.fuse(d.ben.map(function(r){
      return {date:r.date, w:+r.w||weekOf(r.date), refl:num(r.refl), resp:r.resp===true||r.resp==="Sì",
        camm:num(r.camm), hrv:num(r.hrv), read:num(r.read), sonno:num(r.sonno),
        alc:r.alc===true||r.alc==="Sì", note:r.note||""};
    }), S.ben, byDate);
    this.last=new Date(); this.state="ok";
  },
  /* dallo stato dell'app al foglio: solo quello che manca, quindi si può ripetere */
  payloadAll(){
    return {
      log: S.log.map(r=>({id:r.id,w:r.w,date:r.date,day:r.day,ex:r.ex,gruppo:meta(r.ex).g,side:r.side,band:r.band,
        load:r.load,reps:r.reps.join("|"),serie:r.reps.length,tot:r.reps.reduce((a,b)=>a+b,0),
        vol:r.load*r.reps.reduce((a,b)=>a+b,0),rir:r.rir,top:r.top?"Sì":"No",note:r.note})),
      sess: S.sess.map(r=>({id:r.id,w:r.w,date:r.date,day:r.day,sede:r.sede,mod:r.mod,min:r.min,en:r.en,
        warm:r.warm?"Sì":"No",sig:r.sig?"Sì":"No",note:r.note})),
      mis: S.mis.map(r=>({w:r.w,date:r.date,peso:r.peso,torace:r.torace,bic:r.bic,coscia:r.coscia,vita:r.vita,note:r.note})),
      ben: S.ben.map(r=>({date:r.date,w:r.w,refl:r.refl,resp:r.resp?"Sì":"No",camm:r.camm,hrv:r.hrv,
        read:r.read,sonno:r.sonno,alc:r.alc?"Sì":"No",note:r.note}))
    };
  }
};

/* ---------- top bar ---------- */
function topbar(title, sub){
  var d=S.draft, clock="";
  if(d){ var el=(Date.now()-d.t0)/60000; clock='<div class="clock'+(el>70?" warn":"")+'" id="sclock">'+Math.floor(el)+"′</div>"; }
  return '<header class="top"><div class="wrap"><div class="toprow"><div>'+
    '<div class="eyebrow">'+esc(sub)+'</div><h1>'+esc(title)+'</h1></div>'+clock+'</div></div></header>';
}

/* ---------- OGGI ---------- */
function viewOggi(){
  if(S.draft) return viewSession();
  var w=weekOf(today()), done=S.sess.filter(s=>s.w===w);
  var order=["A","B","C","D"], next=order.filter(d=>!done.some(s=>s.day===d))[0]||"A";
  var h=topbar("Settimana "+w, dayName(today())+" "+today());
  h+='<div class="wrap">';
  if(Store.ok===false) h+=storageAlarm();
  if(!S.log.length){ /* primo avvio su un dispositivo nuovo */
    h+='<div class="card" style="border-color:var(--glow)"><div class="eyebrow glow">Prima cosa da fare</div>'+
      '<h2 style="margin:4px 0 6px">Riporta il tuo storico</h2>'+
      '<div class="sm mut">Questa copia è vuota. Apri il backup .json che hai scaricato dall\'altra versione: tornano log, sessioni, misure e modifiche al piano.</div>'+
      '<button class="btn pri" style="margin-top:12px" data-a="imp">Ripristina il backup</button></div>'; }
  var bk=backupState();
  if(bk.due) h+='<div class="flag '+(bk.safe?"disc":"stop")+'" style="margin-top:12px"><b>⤓</b><div>'+
    (bk.safe ? "Lo storico è nel foglio, ma piano e check simmetria vivono solo qui: un backup ogni due mesi li mette al sicuro."
      : (bk.never? "Non hai ancora fatto un backup." : "Ultimo backup "+bk.days+" giorni fa")+
        (bk.since? " · "+bk.since+" sessioni registrate da allora." : "."))+
    ' <button data-a="dlj" style="color:inherit;text-decoration:underline;font-weight:700;padding:0">Scaricalo ora</button></div></div>';
  h+='<div class="card"><div class="between"><div><div class="eyebrow">Fatte questa settimana</div>'+
     '<div class="num" style="font-size:26px">'+done.length+'<span class="mut" style="font-size:16px;font-weight:500">/4</span></div></div>'+
     '<div class="sets" style="max-width:190px">'+order.map(d=>'<div class="chip '+(done.some(s=>s.day===d)?"top":"")+'">'+d+'</div>').join("")+'</div></div></div>';

  h+='<div class="eyebrow" style="margin:16px 0 6px">Apri una sessione</div>';
  ["A","B","C","D","T1","T2"].forEach(function(d){
    var p=PLAN[d], is=d===next;
    h+='<button class="card" data-a="open" data-d="'+d+'" style="display:block;width:100%;text-align:left;'+
      (is?"border-color:var(--glow)":"")+'">'+
      '<div class="between"><div><div class="eyebrow '+(is?"glow":"")+'">'+d+(is?" · consigliata oggi":" · "+p.sede)+'</div>'+
      '<h2 style="margin-top:3px">'+esc(p.name)+'</h2>'+
      '<div class="sm mut" style="margin-top:3px">'+p.ex.length+' esercizi · '+p.min+' min · dischi '+esc(p.dischi)+'</div></div>'+
      '<div style="font-size:22px;color:var(--dim)">›</div></div></button>';
  });

  var ups=[], seen={};
  Object.keys(PLAN).forEach(function(d){ PLAN[d].ex.forEach(function(e){
    if(seen[e.n]) return; seen[e.n]=1; var r=readiness(e); if(r.ready && !r.cap) ups.push(e.n+": "+r.why);
  });});
  if(ups.length){
    h+='<div class="eyebrow" style="margin:18px 0 6px">Pronti per salire</div><div class="card">';
    ups.forEach(u=>h+='<div class="flag up"><b>↑</b><div>'+esc(u)+'</div></div>');
    h+='<div class="xs mut" style="margin-top:8px">Top del range su 3 serie su 4 per due sessioni consecutive.</div></div>';
  }
  var lastS=S.sess[S.sess.length-1];
  if(lastS) h+='<div class="card flat"><div class="eyebrow">Ultima sessione</div><div class="sm" style="margin-top:4px">'+
    lastS.day+" · "+lastS.date+" ("+ago(lastS.date)+") · "+lastS.min+" min · energia "+lastS.en+'</div></div>';
  h+='</div>';
  return h;
}

/* ---------- sessione in corso ---------- */
function viewSession(){
  var d=S.draft, p=PLAN[d.day];
  var h=topbar(p.name, "Giorno "+d.day+" · settimana "+weekOf(d.date));
  h+='<div class="wrap">';

  /* riscaldamento */
  var wdone=d.warm.filter(Boolean).length;
  h+='<div class="card"><div class="between"><div class="eyebrow '+(wdone===WARM.length?"":"amb")+'">Riscaldamento · 6 minuti · '+wdone+"/"+WARM.length+'</div>'+
     '<button class="btn sm ghost" data-a="wall">'+(wdone===WARM.length?"Azzera":"Tutti")+'</button></div>';
  if(wdone<WARM.length) h+='<div class="xs mut" style="margin:6px 0 2px">È il blocco scoliosi. Se la sessione è corta, taglia un isolamento, non questo.</div>';
  WARM.forEach(function(x,i){
    var dd = x.var ? x.var[d.day] : x.d;
    h+='<div class="check '+(d.warm[i]?"on":"")+'"><div class="box" data-a="warm" data-i="'+i+'" style="cursor:pointer">✓</div>'+
       '<div class="t" data-a="warm" data-i="'+i+'" style="flex:1"><div style="font-weight:600;font-size:14.5px">'+esc(x.n)+'</div>'+
       '<div class="xs mut">'+esc(dd)+'</div></div>'+
       (G[x.n]?'<button class="btn sm ghost" data-a="gwarm" data-i="'+i+'" style="min-width:38px">?</button>':"")+'</div>';
  });
  h+='</div>';

  if(p.dischi!=="solo bande") h+='<div class="flag disc"><b>Dischi</b><div>'+esc(p.dischi)+' — cambiali <b>dentro</b> il recupero, non dopo.</div></div>';

  /* esercizi */
  d.ex.forEach(function(e,i){ h+=exCard(e,i,p.ex[i]); });

  h+='<div style="margin:18px 0 30px"><button class="btn pri" data-a="close">Chiudi la sessione</button>'+
     '<button class="btn ghost" style="margin-top:8px" data-a="abort">Annulla</button></div>';
  h+='</div>';
  h+=restBar();
  return h;
}
function restBar(){
  if(!rest) return "";
  return '<div style="position:fixed;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom));z-index:45">'+
    '<div class="wrap"><div class="card" style="margin:0 0 8px;background:var(--surf2);border-color:var(--amb)">'+
    '<div class="between"><div><div class="eyebrow amb">Recupero '+esc(rest.lbl)+'</div>'+
    '<div class="num" style="font-size:26px" id="rclock">'+mmss((rest.end-Date.now())/1000)+'</div></div>'+
    '<div class="row"><button class="btn sm ghost" data-a="rest+">+30s</button>'+
    '<button class="btn sm" data-a="rest0">Stop</button></div></div></div></div></div>';
}
function exCard(e,i,def){
  var m=meta(e.n), sets=e.sets, target=def.s+" × "+(def.lo===def.hi?def.lo:def.lo+"-"+def.hi)+(m.sec?"s":"");
  var full=sets.length>=def.s;
  var h='<div class="card" style="'+(full?"opacity:.62":"")+'">';
  h+='<div class="between"><div style="flex:1"><h2>'+esc(e.n)+'</h2>'+
     '<div class="xs mut" style="margin-top:2px">'+esc(m.g)+' · '+target+(def.u?" · per lato":"")+'</div></div>';
  if(G[e.n]||def.tip) h+='<button class="btn sm ghost" data-a="tip" data-i="'+i+'" style="min-width:40px">?</button>';
  h+='</div>';

  var lt=lastTwo(e.n);
  if(lt.length) h+='<div class="xs mut" style="margin-top:7px">'+lt.map(r=>r.date.slice(0,5)+" · "+(r.load?r.load+" kg · ":"")+r.reps.join("/")).join("  |  ")+'</div>';

  var r=readiness(def);
  if(r.ready && !full) h+='<div class="flag '+(r.cap?"info":"up")+'" style="margin-top:9px"><b>'+(r.cap?"Tetto":"↑")+'</b><div>'+esc(r.why)+'</div></div>';
  if(def.swap) h+='<div class="flag disc" style="margin-top:9px"><b>⟳</b><div>'+esc(def.swap)+' mentre fai questo.</div></div>';

  /* carico o banda */
  if(def.b){
    h+='<div class="pills" style="margin-top:10px">'+BANDS.map(b=>'<button class="pill '+(e.band===b?"on":"")+'" data-a="band" data-i="'+i+'" data-v="'+b+'">'+b+'</button>').join("")+'</div>';
  } else if(!m.sec && (def.L || e.load)){
    h+='<div class="row" style="margin-top:10px"><div class="eyebrow" style="width:52px">Carico</div>'+
       '<div class="step" style="flex:1"><button data-a="load-" data-i="'+i+'">−</button>'+
       '<div class="val">'+e.load+'<small>kg</small></div>'+
       '<button data-a="load+" data-i="'+i+'">+</button></div></div>';
  }

  /* serie fatte */
  if(sets.length){
    h+='<div class="sets" style="margin-top:10px">'+sets.map(function(s,j){
      var lab = def.u ? s.S+"·"+s.D : s.v;
      var isTopS = def.u ? (s.S>=def.hi && s.D>=def.hi) : s.v>=def.hi;
      return '<button class="chip '+(isTopS?"top":"done")+'" data-a="undo" data-i="'+i+'" data-j="'+j+'">'+lab+'</button>';
    }).join("")+'</div>';
  }

  if(!full){
    if(def.u){
      h+='<div class="plumb"><div class="lbl"><span class="l">Sinistra</span><span class="r">Destra</span></div>';
      h+='<div class="row" style="gap:8px;margin-top:6px">'+
        '<div class="step" style="flex:1"><button data-a="l-" data-i="'+i+'">−</button><div class="val">'+e.cur.S+'</div><button data-a="l+" data-i="'+i+'">+</button></div>'+
        '<div class="step" style="flex:1"><button data-a="r-" data-i="'+i+'">−</button><div class="val">'+e.cur.D+'</div><button data-a="r+" data-i="'+i+'">+</button></div></div>';
      if(def.asym) h+='<div class="xs mut" style="margin-top:6px">Sinistra 60s · destra 40s. Convessità lombare a sinistra.</div>';
      h+='</div>';
    } else {
      h+='<div class="row" style="margin-top:10px"><div class="eyebrow" style="width:52px">'+(m.sec?"Sec":"Rep")+'</div>'+
        '<div class="step" style="flex:1"><button data-a="v-" data-i="'+i+'">−</button><div class="val">'+e.cur.v+'</div>'+
        '<button data-a="v+" data-i="'+i+'">+</button></div></div>';
    }
    h+='<button class="btn amb" style="margin-top:10px" data-a="set" data-i="'+i+'">Serie '+(sets.length+1)+' fatta</button>';
  } else {
    h+='<div class="row" style="margin-top:10px"><div class="eyebrow" style="width:52px">RIR</div>'+
      '<div class="pills" style="flex:1;padding:0">'+[0,1,2,3,4].map(v=>'<button class="pill '+(e.rir===v?"on":"")+'" data-a="rir" data-i="'+i+'" data-v="'+v+'">'+v+'</button>').join("")+'</div></div>';
    h+='<input type="text" placeholder="Nota (sensazioni, tecnica, dolore…)" value="'+esc(e.note)+'" data-note="'+i+'" style="margin-top:9px">';
  }
  return h+'</div>';
}

/* ---------- PROGRESSI ---------- */
/* formattazione italiana indipendente dal dispositivo */
function kfmt(n){ return String(Math.round(n||0)).replace(/\B(?=(\d{3})+(?!\d))/g,"."); }
function dec(n){ return (n===null||n===undefined)?"–":String(n).replace(".",","); }
function stat(l,v,u,c){
  return '<div class="stat"><div class="eyebrow">'+l+'</div><div class="v"'+(c?' style="color:'+c+'"':'')+'>'+
    v+(u?'<small> '+u+'</small>':'')+'</div></div>';
}
function viewProg(){
  var ws=weeks().slice(-8), ks=ws.map(kpi), last=ks[ks.length-1];
  var prev=null; for(var i=ks.length-2;i>=0;i--){ if(ks[i].ton){ prev=ks[i]; break; } }
  var h=topbar("Progressi","Storico dalla settimana 24");
  h+='<div class="wrap">';

  /* riepilogo della settimana corrente */
  h+='<div class="card"><div class="eyebrow glow">Settimana '+last.w+'</div>'+
     '<div class="grid2" style="margin-top:9px;row-gap:15px">'+
     stat("Sessioni", last.n+"/4","", last.n>=4?"var(--ok)":"var(--amb)")+
     stat("Durata media", (last.dur||"–"),"min", last.dur>75?"var(--alert)":"")+
     stat("Energia", dec(last.en),"su 5", (last.en&&last.en<4)?"var(--amb)":"")+
     stat("Top range", (last.top!==null?last.top+"%":"–"),"", (last.top!==null&&last.top>=70)?"var(--ok)":"")+
     '</div></div>';

  /* tonnellaggio */
  var maxT=Math.max.apply(null,ks.map(function(k){return k.ton||0;}))||1;
  var d = (prev&&prev.ton) ? Math.round((last.ton-prev.ton)/prev.ton*100) : null;
  h+='<div class="card"><div class="between" style="align-items:flex-start">'+
     '<div><div class="eyebrow">Tonnellaggio</div><div class="stat"><div class="v">'+
     (last.ton||0).toLocaleString("it")+'<small> kg</small></div></div></div>'+
     (d!==null?'<div class="delta" style="color:'+(d>=0?"var(--ok)":"var(--amb)")+'">'+
       (d>=0?"▲ +":"▼ ")+d+'%<div class="xs mut" style="font-weight:500;text-align:right">vs sett. '+prev.w+'</div></div>':"")+
     '</div>';
  h+='<div class="bars" style="margin-top:14px">'+ks.map(function(k,i){
       return '<i class="'+(i===ks.length-1?"cur":(k.ton?"on":""))+'" style="height:'+
         Math.max(3, Math.round((k.ton||0)/maxT*100))+'%"></i>'; }).join("")+'</div>';
  h+='<div class="barlab">'+ks.map(function(k,i){
       return '<span class="'+(i===ks.length-1?"cur":"")+'">'+k.w+'</span>'; }).join("")+'</div></div>';

  /* serie per gruppo, con la fascia bersaglio disegnata */
  h+='<div class="card"><div class="between"><div class="eyebrow">Serie per gruppo</div>'+
     '<div class="xs mut">fascia verde = target</div></div>';
  Object.keys(TGT).forEach(function(g){
    var v=last.grp[g]||0, t=TGT[g];
    var max=Math.max(t[1]*1.3, v*1.15, 1);
    var col = v<t[0]?"var(--alert)" : v>t[1]?"var(--amb)" : "var(--ok)";
    h+='<div style="margin-top:12px">'+
      '<div class="between" style="margin-bottom:5px"><span class="sm" style="font-weight:600">'+g+'</span>'+
      '<span class="xs"><b style="color:'+col+';font-size:13px">'+v+'</b><span class="mut"> / '+t[0]+'–'+t[1]+'</span></span></div>'+
      '<div class="track">'+
        '<div class="band" style="left:'+(t[0]/max*100)+'%;width:'+((t[1]-t[0])/max*100)+'%"></div>'+
        '<div class="tick" style="left:'+(t[0]/max*100)+'%"></div>'+
        '<div class="tick" style="left:'+(t[1]/max*100)+'%"></div>'+
        '<div class="fill" style="width:'+Math.min(100,v/max*100)+'%;background:'+col+'"></div>'+
      '</div></div>';
  });
  h+='<div class="xs mut" style="margin-top:11px">Un esercizio unilaterale vale una serie, non due: sinistra e destra descrivono lo stesso lavoro.</div></div>';

  /* andamento settimanale */
  h+='<div class="card"><div class="eyebrow">Andamento</div><table style="margin-top:8px"><tr>'+
     '<th>Sett.</th><th class="n">Sess</th><th class="n">Min</th><th class="n">Energia</th><th class="n">Top</th><th class="n">Asim</th></tr>'+
     ks.slice().reverse().map(function(k){
       return '<tr><td style="font-weight:700">'+k.w+'</td>'+
       '<td class="n">'+k.n+'/4</td>'+
       '<td class="n" style="color:'+(k.dur>75?"var(--alert)":"inherit")+'">'+(k.dur||"–")+'</td>'+
       '<td class="n" style="color:'+((k.en&&k.en<4)?"var(--amb)":"inherit")+'">'+dec(k.en)+'</td>'+
       '<td class="n">'+(k.top!==null?k.top+"%":"–")+'</td>'+
       '<td class="n" style="color:'+(k.asim>10?"var(--amb)":"inherit")+'">'+k.asim+'%</td></tr>'; }).join("")+
     '</table></div>';

  /* carichi chiave con variazione */
  h+='<div class="card"><div class="eyebrow">Carichi chiave</div><table style="margin-top:8px">'+
     '<tr><th>Esercizio</th><th class="n">Oggi</th><th class="n">Inizio</th><th class="n">Δ</th></tr>';
  [["Floor Press manubri","Floor Press"],["Rematore manubri","Rematore"],["Box Squat","Box Squat"],
   ["Shoulder Press manubri","Shoulder Press"],["Bulgarian Split Squat manubri","Bulgarian"],
   ["Split-stance RDL","Split RDL"]].forEach(function(p){
    var hh=hist(p[0]).filter(function(r){return r.load>0;}); if(!hh.length) return;
    var a=hh[0].load, b=hh[hh.length-1].load, dd=b-a;
    h+='<tr><td>'+esc(p[1])+'</td><td class="n">'+b+' kg</td><td class="n mut">'+a+'</td>'+
       '<td class="n" style="color:'+(dd>0?"var(--ok)":dd<0?"var(--amb)":"var(--dim)")+'">'+(dd>0?"+"+dd:dd||"=")+'</td></tr>';
  });
  h+='</table></div>';

  /* diagnosi */
  var dg=diagnose();
  h+='<div class="between" style="margin:20px 0 6px"><div class="eyebrow">Diagnosi</div>'+
     '<div class="xs" style="font-weight:700;color:'+(dg.length?"var(--amb)":"var(--ok)")+'">'+
     (dg.length? dg.length+" da leggere" : "nulla da segnalare")+'</div></div>';
  dg.forEach(function(x){
    var cls = (x.k==="segnale"||x.k==="stallo"||x.k==="crollo") ? "stop"
            : (x.k==="leggero"||x.k==="volume") ? "disc" : "info";
    h+='<div class="flag '+cls+'"><b>'+esc(x.t)+'</b><div>'+esc(x.m)+'</div></div>';
  });
  h+='<div class="xs mut" style="margin:12px 0 30px">La diagnosi legge solo i numeri. Cambiare esercizio o ridistribuire il volume è una decisione da portare al coach.</div>';
  h+='</div>';
  return h;
}
/* ---------- CORPO ---------- */
function viewCorpo(){
  var h=topbar("Corpo","Misure · benessere · simmetria");
  h+='<div class="wrap">';
  var lastM=S.mis[S.mis.length-1], gap=lastM?Math.round((new Date()-s2d(lastM.date))/86400000):99;
  h+='<div class="card"><div class="between"><div class="eyebrow">Misure · ogni 14 giorni</div>'+
     '<button class="btn sm '+(gap>=14?"amb":"ghost")+'" data-a="mis">'+(gap>=14?"Da fare":"Aggiungi")+'</button></div>';
  if(lastM){
    h+='<div class="grid3" style="margin-top:10px">'+
      mini("Peso",(lastM.peso||"–")+" kg")+mini("Vita/Torace", lastM.vita&&lastM.torace?(lastM.vita/lastM.torace).toFixed(3):"–")+
      mini("Ultima", ago(lastM.date))+'</div>';
    h+='<div class="xs mut" style="margin-top:8px">Al mattino a digiuno, dopo il bagno, stesso metro. Torace a fine espirazione normale.</div>';
  }
  h+='</div>';

  var td=today(), b=S.ben.filter(x=>x.date===td)[0];
  h+='<div class="card"><div class="between"><div class="eyebrow">Benessere di oggi</div>'+
     '<button class="btn sm '+(b?"ghost":"amb")+'" data-a="ben">'+(b?"Modifica":"30 secondi")+'</button></div>';
  if(b) h+='<div class="sm" style="margin-top:9px">Reflusso '+(b.refl===null?"–":b.refl)+' · camminate '+(b.camm===null?"–":b.camm)+
    ' · HRV '+(b.hrv||"–")+' · readiness '+(b.read||"–")+' · sonno '+(b.sonno||"–")+'h · alcol '+(b.alc?"sì":"no")+'</div>';
  else h+='<div class="xs mut" style="margin-top:8px">La sera, prima di dormire, tutto insieme.</div>';
  h+='</div>';

  var w=weekOf(today()), due=[31,35,39,43].indexOf(w)>=0;
  h+='<div class="card"><div class="between"><div class="eyebrow '+(due?"amb":"")+'">Check simmetria · settimane 31 · 35 · 39 · 43</div>'+
     (due?'<button class="btn sm amb" data-a="sim">Compila</button>':"")+'</div>';
  h+='<div class="xs mut" style="margin-top:8px">Quattro domande, quattro volte l\'anno. Floor Press nel giorno A, Box Squat nel B, RDL nel D, bird-dog nel riscaldamento.</div>';
  if(S.sim.length) h+='<div class="sm" style="margin-top:9px">Ultimo: '+S.sim[S.sim.length-1].date+'</div>';
  h+='</div>';

  h+='<div class="card flat"><div class="eyebrow">Riferimento clinico</div>'+
     '<div class="sm mut" style="margin-top:6px">RX rachide in toto, 31/10/2008 — dorsale dx-convessa 20° Cobb, lombare sn-convessa 29° Cobb (curva maggiore), emibacino sn più basso di 1,3 cm. Referto non aggiornato.</div></div>';

  h+='<div class="eyebrow" style="margin:16px 0 6px">I tre segnali che fermano la serie</div><div class="card">';
  STOPS.forEach(s=>h+='<div class="flag stop">•<div>'+esc(s)+'</div></div>');
  h+='</div><div style="height:24px"></div></div>';
  return h;
}
function fallbackSheet(){
  sheet('<div class="eyebrow amb">La sessione non è al sicuro</div>'+
    '<div class="sm" style="margin-top:8px">Non è finita né sul foglio né nella memoria del dispositivo. '+
    'Copiala adesso e incollala nel tracker: sono trenta secondi e non la perdi.</div>'+
    '<button class="btn pri" style="margin-top:14px" data-a="tsv">Copia le righe per Sheets</button>'+
    '<button class="btn" style="margin-top:8px" data-a="dlj">Scarica il backup</button>'+
    '<button class="btn ghost" style="margin-top:8px" data-a="x">Chiudi</button>');
}
function storageAlarm(){
  return '<div class="flag stop" style="margin-top:12px"><b>⚠</b><div>'+
    '<b>I dati non si stanno salvando.</b> Quello che inserisci resta solo finché non chiudi. '+

/* ---------- nav ---------- */
function nav(){

function render(){
  if(!PLAN) PLAN=buildPlan();

/* ---------- azioni ---------- */
document.addEventListener("click", function(ev){
  var el=ev.target.closest("[data-a]"); if(!el) return;
  var a=el.dataset.a, i=+el.dataset.i, j=+el.dataset.j, v=el.dataset.v, d=S.draft;
  var def = d ? PLAN[d.day].ex[i] : null, e = d ? d.ex[i] : null;
  window._sy = window.scrollY;

  if(a==="nav"){ V=v; window._sy=0; render(); return; }
  if(a==="open"){ startSession(el.dataset.d); return; }
  if(a==="warm"){ d.warm[i]=!d.warm[i]; render(); return; }
  if(a==="wall"){ var all=d.warm.every(Boolean); d.warm=d.warm.map(()=>!all); render(); return; }
  if(a==="tip"){ guideSheet(def.n, def.tip); return; }
  if(a==="gwarm"){ guideSheet(WARM[i].n, ""); return; }
  if(a==="full"){ var f=document.getElementById("gfull"); if(f) f.style.display = f.style.display==="none"?"block":"none"; return; }
  if(a==="x"){ closeSheet(); return; }
  if(a==="band"){ e.band=v; save(); render(); return; }
  if(a==="load+"||a==="load-"){
    var m=meta(e.n), st=m.step||2, nv=e.load+(a==="load+"?st:-st);
    if(m.cap && nv>m.cap){ toast("Tetto "+m.cap+" kg. Progredisci con il tempo."); return; }
    e.load=Math.max(0,nv); save(); render(); return;
  }
  if(a==="v+"||a==="v-"){ e.cur.v=Math.max(0,e.cur.v+(a==="v+"?(meta(e.n).sec?5:1):(meta(e.n).sec?-5:-1))); render(); return; }
  if(a==="l+"||a==="l-"){ e.cur.S=Math.max(0,e.cur.S+(a==="l+"?(meta(e.n).sec?5:1):(meta(e.n).sec?-5:-1))); render(); return; }
  if(a==="r+"||a==="r-"){ e.cur.D=Math.max(0,e.cur.D+(a==="r+"?(meta(e.n).sec?5:1):(meta(e.n).sec?-5:-1))); render(); return; }
  if(a==="set"){
    e.sets.push(def.u ? {S:e.cur.S, D:e.cur.D} : {v:e.cur.v});
    startRest(meta(e.n).t, e.n); save(); render(); return;
  }
  if(a==="undo"){ e.sets.splice(j,1); save(); render(); return; }
  if(a==="rir"){ e.rir=+v; save(); render(); return; }
  if(a==="rest+"){ rest.end+=30000; return; }
  if(a==="rest0"){ stopRest(); render(); return; }
  if(a==="abort"){ if(confirm("Annullare la sessione? I dati non vengono salvati.")){ S.draft=null; stopRest(); save(); render(); } return; }
  if(a==="close"){ closeSession(); return; }
  if(a==="savesess"){ commitSession(); return; }
  if(a==="mis"){ formMis(); return; }
  if(a==="savemis"){ saveMis(); return; }
  if(a==="ben"){ formBen(); return; }
  if(a==="saveben"){ saveBen(); return; }
  if(a==="sim"){ formSim(); return; }
  if(a==="savesim"){ saveSim(); return; }
  if(a==="brief"){ copy(briefing(),"Briefing copiato. Incollalo in chat."); return; }
  if(a==="tsv"){ copy(tsv(),"Righe copiate. Incolla in Log_Esercizi."); return; }
  if(a==="dlj"){
    download("rachide-"+today().replace(/\//g,"-")+".json", JSON.stringify(S), "application/json");
    S.lastBackup=today(); save(); closeSheet(); render();
    toast("Backup scaricato. Spostalo su Drive."); return; }
  if(a==="dlt"){ download("log-"+today().replace(/\//g,"-")+".tsv", tsv(), "text/tab-separated-values"); return; }
  if(a==="imp"){ importer(); return; }
  if(a==="stest"){ storageTest(); return; }
  if(a==="scfg"){ syncForm(); return; }
  if(a==="ssave"){ syncSave(); return; }
  if(a==="sdiag"){ syncDiag(); return; }
  if(a==="spull"){ doPull(true); return; }
  if(a==="spush"){ doPush(true); return; }
  if(a==="pprev"){ patchPreview(); return; }
  if(a==="papply"){ patchApply(); return; }
  if(a==="prev"){ if(confirm("Annullare l'ultima modifica al piano?")){ S.patches.pop(); PLAN=buildPlan(); save(); render(); toast("Modifica annullata"); } return; }
});
/* selezione singola dentro i pannelli: un solo gestore per tutti i form */
document.addEventListener("click", function(ev){
  var keys=["en","sig","r","c","p","x","q","s"];
  for(var i=0;i<keys.length;i++){
    var b=ev.target.closest("[data-"+keys[i]+"]");
    if(b && b.classList.contains("pill")){
      [].forEach.call(b.parentNode.children, p=>p.classList.remove("on"));
      b.classList.add("on"); return;
    }
  }
});
document.addEventListener("input", function(ev){
  var t=ev.target;
  if(t.dataset.note!==undefined && S.draft){ S.draft.ex[+t.dataset.note].note=t.value; save(); }
});

/* ---------- sessione ---------- */
function guideSheet(n, tip){
  var g=G[n];
  var h='<div class="eyebrow amb">Guida tecnica</div><h2 style="margin:3px 0 12px">'+esc(n)+'</h2>';
  if(tip) h+='<div class="flag info"><b>Piano</b><div>'+esc(tip)+'</div></div>';
  if(ANIM[n]) h+=animBlock(n);
  if(g){
    h+='<div style="margin-top:14px"><div class="eyebrow" style="color:var(--ok)">Devi sentire</div>'+
       '<div class="sm" style="margin-top:4px">'+esc(g.f)+'</div></div>';
    h+='<div style="margin-top:14px"><div class="eyebrow" style="color:var(--alert)">Stai sbagliando se</div>'+
       '<div class="sm" style="margin-top:4px">'+esc(g.e)+'</div></div>';
    h+='<div style="margin-top:14px"><div class="eyebrow amb">Correzione</div>'+
       '<div class="sm" style="margin-top:4px">'+esc(g.c)+'</div></div>';
    h+='<button class="btn ghost sm" style="width:100%;margin-top:16px" data-a="full">Setup ed esecuzione</button>'+
       '<div id="gfull" style="display:none;margin-top:10px"><div class="sm mut">'+esc(g.p)+'</div></div>';
  } else if(!tip){ h+='<div class="sm mut">Nessuna scheda tecnica per questo esercizio.</div>'; }
  h+='<button class="btn" style="margin-top:16px" data-a="x">Chiudi</button>';
  sheet(h);
  if(ANIM[n]) startAnim(n);
}
function startSession(day){
  var p=PLAN[day];
  S.draft={day:day, date:today(), t0:Date.now(), warm:WARM.map(()=>false),
    ex:p.ex.map(function(x){
      var m=meta(x.n);
      return {n:x.n, load: x.b?0:suggestLoad(x), band: x.b?lastBand(x.n,x.b):"",
        sets:[], rir:null, note:"",
        cur: x.u ? {S:(m.sec?x.hi:x.lo), D:(m.sec?x.lo:x.lo)} : {v:(m.sec?x.hi:x.lo)}};
    })};
  V="oggi"; window._sy=0; save(); render();
}
function startRest(t, n){ var sec=REST[t]||60; rest={end:Date.now()+sec*1000, lbl:sec+"s · "+n}; }
function stopRest(){ rest=null; }
function closeSession(){
  var d=S.draft, min=Math.max(1,Math.round((Date.now()-d.t0)/60000));
  var logged=d.ex.filter(e=>e.sets.length).length;
  sheet('<div class="eyebrow">Chiudi la sessione</div><h2 style="margin:4px 0 12px">Giorno '+d.day+' · '+logged+'/'+d.ex.length+' esercizi</h2>'+
    '<label class="fld"><span class="eyebrow">Durata (min)</span><input type="number" id="fMin" value="'+min+'"></label>'+
    '<label class="fld"><span class="eyebrow">Energia</span><div class="pills" id="fEn">'+
      [1,2,3,4,5].map(v=>'<button class="pill" data-en="'+v+'">'+v+'</button>').join("")+'</div></label>'+
    '<label class="fld"><span class="eyebrow">Segnale articolare</span><div class="pills" id="fSig">'+
      '<button class="pill on" data-sig="0">No</button><button class="pill" data-sig="1">Sì</button></div></label>'+
    '<label class="fld"><span class="eyebrow">Note</span><textarea id="fNote" placeholder="Cosa è successo oggi"></textarea></label>'+
    '<button class="btn pri" style="margin-top:14px" data-a="savesess">Salva</button>'+
    '<button class="btn ghost" style="margin-top:8px" data-a="x">Torna indietro</button>');
}
async function commitSession(){
  var d=S.draft, p=PLAN[d.day], w=weekOf(d.date);
  var en=document.querySelector("#fEn .pill.on"), sg=document.querySelector("#fSig .pill.on");
  d.ex.forEach(function(e,i){
    var def=p.ex[i]; if(!e.sets.length) return;
    if(def.u){
      ["S","D"].forEach(function(sd){
        var reps=e.sets.map(s=>s[sd]);
        S.log.push({id:uid("l"), w:w, date:d.date, day:d.day, ex:e.n, side:sd, band:e.band, load:e.load,
          reps:reps, rir:e.rir, top:isTop(reps, def.hi, def.s), note:e.note});
      });
    } else {
      var reps=e.sets.map(s=>s.v);
      S.log.push({id:uid("l"), w:w, date:d.date, day:d.day, ex:e.n, side:"", band:e.band, load:e.load,
        reps:reps, rir:e.rir, top:isTop(reps, def.hi, def.s), note:e.note});
    }
  });
  S.sess.push({id:uid("s"), w:w, date:d.date, day:d.day, sede:p.sede, mod:(p.sede==="Casa"?"Pesi":"Bande"),
    min:+document.getElementById("fMin").value||0, en:en?+en.dataset.en:0,
    warm:d.warm.every(Boolean), sig: sg? sg.dataset.sig==="1":false,
    note:document.getElementById("fNote").value});
  S.draft=null; stopRest(); var okS=await save(); closeSheet(); V="prog"; window._sy=0; render();
  if(SYNC.on()){
    var sent=await doPush(false);
    toast(sent? "Sessione salvata sul foglio" : "Foglio non raggiunto: usa Coach → Invia tutto");
    if(!sent) setTimeout(fallbackSheet, 700);
  } else {
    toast(okS?"Sessione salvata":"Sessione NON salvata");
    if(!okS) setTimeout(fallbackSheet, 700);
  }
  var bk=backupState();
  if(bk.due) setTimeout(function(){
    sheet('<div class="eyebrow amb">Prima di chiudere</div><h2 style="margin:4px 0 10px">Fai il backup</h2>'+
      '<div class="sm">'+(bk.never? "Non ne hai ancora fatto uno. " : "L'ultimo è di "+bk.days+" giorni fa. ")+
      'Da allora hai registrato <b>'+bk.since+' sessioni</b>: è quello che perderesti se il telefono cancellasse i dati del sito.</div>'+
      '<button class="btn pri" style="margin-top:14px" data-a="dlj">Scarica il backup</button>'+
      '<button class="btn ghost" style="margin-top:8px" data-a="x">Più tardi</button>');
  }, 900);
}
